name: Build package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build source package
    uses: seanthimons/baseline/.github/workflows/build-package.yaml@e53831a23ef8f543c3fee58edd390089b0f13a27 # v1.4.0
